<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ СпортСтат</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">

</head>
<body>
    <div class="app" id="app">
        <!-- Навигация -->
        <nav class="navbar">
            <button class="nav-btn active" data-page="page-tournaments">

            <button class="nav-btn" data-page="page-stats">
                <i class="fas fa-chart-bar"></i> Статистика

                <i class="fas fa-users"></i> Профиль игроков
            </button>

        <!-- Страницы -->
        <div class="page active" id="page-tournaments"></div>
        <div class="page" id="page-stats"></div>
        <div class="page" id="page-tops"></div>
        <div class="page" id="page-profile"></div>

    <script type="module" src="js/app.js"></script>
