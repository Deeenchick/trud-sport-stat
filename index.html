<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ СпортСтат</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0e12;
            color: #e8edf5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(22, 28, 38, 0.7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            color: #ffd700;
        }
        .tournament-card {
            background: rgba(22, 28, 38, 0.5);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 10px;
            cursor: pointer;
            border-left: 4px solid #ffd700;
            transition: 0.3s;
        }
        .tournament-card:hover {
            background: rgba(255, 215, 0, 0.05);
            transform: translateX(4px);
        }
        .status-badge {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-completed {
            background: #0f2a1a;
            color: #5dca8a;
        }
        .status-live {
            background: #2a1f0a;
            color: #f5a623;
        }
        .status-scheduled {
            background: #1a1f2a;
            color: #5a7a9a;
        }
        .loading {
            text-align: center;
            color: #ffd700;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #ffd700;">⚽ СпортСтат</h1>
        
        <div class="card">
            <h2>📋 Турниры</h2>
            <div id="tournaments">
                <div class="loading">Загрузка турниров...</div>
            </div>
        </div>

        <div class="card">
            <h2>🏆 Текущий турнир</h2>
            <div id="tournamentDetail">
                <div class="loading">Выберите турнир</div>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // ПОДКЛЮЧЕНИЕ К SUPABASE
        // ========================================
        const SUPABASE_URL = 'https://obmhexrwltdtldjdeuxo.supabase.co'
        const SUPABASE_ANON_KEY = 'sb_publishable_HX4idr3fjs1BvNTwZidseg_oiQddbPX'
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      
        // ========================================
        // ЗАГРУЗКА ТУРНИРОВ
        // ========================================
        async function loadTournaments() {
            const container = document.getElementById('tournaments')
            
            try {
                const { data, error } = await supabase
                    .from('tournaments')
                    .select('*')
                    .order('date', { ascending: false })
                
                if (error) throw error
                
                if (data && data.length > 0) {
                    container.innerHTML = data.map(t => `
                        <div class="tournament-card" onclick="loadTournamentDetail('${t.id}')">
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                                <div>
                                    <strong>${t.name}</strong>
                                    <span style="color:#7a8399;font-size:14px;margin-left:12px;">
                                        ${t.date} · ${t.time}
                                    </span>
                                </div>
                                <span class="status-badge status-${t.status}">${t.status}</span>
                            </div>
                        </div>
                    `).join('')
                } else {
                    container.innerHTML = '<p style="color:#7a8399;">Нет турниров</p>'
                }
            } catch (error) {
                console.error('Ошибка:', error)
                container.innerHTML = `<p style="color:#e85a5a;">Ошибка загрузки: ${error.message}</p>`
            }
        }

        // ========================================
        // ЗАГРУЗКА ДЕТАЛЕЙ ТУРНИРА
        // ========================================
        async function loadTournamentDetail(tournamentId) {
            const container = document.getElementById('tournamentDetail')
            container.innerHTML = '<div class="loading">Загрузка...</div>'
            
            try {
                // 1. Получаем турнирную таблицу
                const { data: table, error: tableError } = await supabase
                    .rpc('get_tournament_table', {
                        p_tournament_id: tournamentId
                    })
                
                if (tableError) throw tableError
                
                // 2. Получаем матчи
                const { data: matches, error: matchesError } = await supabase
                    .from('matches')
                    .select(`
                        *,
                        team_a:team_a_id (id, name),
                        team_b:team_b_id (id, name)
                    `)
                    .eq('tournament_id', tournamentId)
                    .order('match_order')
                
                if (matchesError) throw matchesError
                
                // 3. Получаем команды
                const { data: teams, error: teamsError } = await supabase
                    .from('tournament_teams')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .order('name')
                
                if (teamsError) throw teamsError
                
                // Строим HTML
                let html = ''
                
                // Турнирная таблица
                if (table && table.length > 0) {
                    html += `
                        <h3>📊 Турнирная таблица</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Команда</th>
                                    <th>И</th>
                                    <th>В</th>
                                    <th>Н</th>
                                    <th>П</th>
                                    <th>ЗМ</th>
                                    <th>ПМ</th>
                                    <th>±</th>
                                    <th>О</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${table.map(row => `
                                    <tr>
                                        <td>${row.place}</td>
                                        <td><strong>${row.team_name}</strong></td>
                                        <td>${row.matches_played}</td>
                                        <td>${row.wins}</td>
                                        <td>${row.draws}</td>
                                        <td>${row.losses}</td>
                                        <td>${row.goals_for}</td>
                                        <td>${row.goals_against}</td>
                                        <td>${row.goal_diff}</td>
                                        <td><strong>${row.points}</strong></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `
                }
                
                // Матчи
                if (matches && matches.length > 0) {
                    html += `
                        <h3 style="margin-top:20px;">📋 Матчи</h3>
                        ${matches.map(m => `
                            <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                                <span>${m.team_a?.name || '?'} vs ${m.team_b?.name || '?'}</span>
                                <span style="font-weight:700;color:#ffd700;">
                                    ${m.status === 'finished' ? `${m.score_a} : ${m.score_b}` : '—'}
                                </span>
                            </div>
                        `).join('')}
                    `
                }
                
                container.innerHTML = html
                
            } catch (error) {
                console.error('Ошибка:', error)
                container.innerHTML = `<p style="color:#e85a5a;">Ошибка загрузки: ${error.message}</p>`
            }
        }

        // ========================================
        // ЗАПУСК
        // ========================================
        loadTournaments()
    </script>
</body>
</html>
